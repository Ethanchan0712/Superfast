<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>快送 · 暫時離線</title>
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/styles.css">
<style>
  .offline-wrap{max-width:520px;margin:12vh auto 0;padding:0 20px;text-align:center}
  .offline-mark{width:74px;height:74px;border-radius:18px;background:var(--hazard);display:grid;place-items:center;margin:0 auto 20px}
  .offline-mark svg{width:40px;height:40px}
  h1{font-size:24px;letter-spacing:.5px}
  p{margin-top:10px;color:var(--muted);font-size:14px;line-height:1.7}
  .offline-btn{display:inline-flex;margin-top:22px;background:var(--ink);color:var(--hazard);text-decoration:none;padding:12px 18px;border-radius:9px;font-weight:700}
</style>
</head>
<body>
<main class="offline-wrap">
  <div class="offline-mark" aria-hidden="true">
    <svg viewBox="0 0 64 64" fill="none" stroke="#12130F" stroke-width="5" stroke-linecap="round"><path d="M17 32h27M33 22l10 10-10 10"/></svg>
  </div>
  <h1>暫時連唔到網</h1>
  <p>快送已經缓存咗基本頁面。你而家可以再試一次；如果仍然連唔到，請檢查網絡後重新開啟。</p>
  <a class="offline-btn" href="./">重新開啟快送</a>
</main>
</body>
</html>
